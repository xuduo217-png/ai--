# Nginx 反向代理配置文件
# 域名: gudeapi.zuoyongyoubao.com
#
# 使用方法：
# 1. 在宝塔面板创建站点 gudeapi.zuoyongyoubao.com
# 2. 将此配置复制到站点设置 -> 配置文件中
# 3. 配置 SSL 证书（推荐使用 Let's Encrypt 免费证书）
# 4. 重启 Nginx

server {
    listen 80;
    listen 443 ssl http2;
    server_name gudeapi.zuoyongyoubao.com;

    # SSL 证书配置（在宝塔面板中配置后自动填充）
    # ssl_certificate /path/to/your/fullchain.pem;
    # ssl_certificate_key /path/to/your/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HTTP 自动跳转 HTTPS
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    # 网站根目录（无需实际文件，仅用于满足 Nginx 配置要求）
    root /www/wwwroot/gudeapi.zuoyongyoubao.com;
    index index.html;

    # 访问日志和错误日志
    access_log /www/wwwroot/gudeapi.zuoyongyoubao.com/logs/access.log;
    error_log /www/wwwroot/gudeapi.zuoyongyoubao.com/logs/error.log;

    # Apple Universal Link 关联文件。HTTPS 请求必须直接返回 200，不能重定向。
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        return 200 '{"applinks":{"apps":[],"details":[{"appID":"RK2294UDR8.com.gude.cwyy","paths":["/alipay/*"]}]}}';
    }

    # 反向代理到 NestJS 应用（端口 3000）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（用于聊天功能）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 缓冲区配置
        proxy_buffering off;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # 上传资源已迁移到腾讯云 COS，API 域名仅保留相对路径兜底跳转。
    location /uploads/ {
        return 302 https://gdcw-1386217335.cos.ap-chengdu.myqcloud.com$request_uri;
    }

    # Swagger API 文档（生产环境建议关闭或限制访问）
    location /api-docs {
        # 只允许内网或特定 IP 访问（可选）
        # allow 192.168.1.0/24;
        # deny all;

        proxy_pass http://127.0.0.1:3000/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 限制上传文件大小（与后端 MAX_FILE_SIZE 保持一致）
    client_max_body_size 800M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
